    <script>
      // Apply the saved colour theme + light/dark mode before first paint (keys match src/lib/themes.ts)
      try {
        var savedTheme = localStorage.getItem('td-theme');
        if (savedTheme) document.documentElement.dataset.theme = savedTheme;
        if (localStorage.getItem('td-mode') === 'light') {
          document.documentElement.dataset.mode = 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F5F6F8');
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
